@if (type === 'card') {
  @for (i of items; track i) {
    <div class="bg-white rounded-xl p-4 shadow-sm mb-3 animate-pulse">
      <div class="h-4 bg-gray-200 rounded w-1/3 mb-2"></div>
      <div class="h-3 bg-gray-200 rounded w-2/3 mb-2"></div>
      <div class="h-3 bg-gray-200 rounded w-1/2"></div>
    </div>
  }
}

@if (type === 'line') {
  @for (i of items; track i) {
    <div
      class="bg-gray-200 rounded animate-pulse mb-2"
      [style.height]="height"
    ></div>
  }
}

@if (type === 'circle') {
  <div
    class="bg-gray-200 rounded-full animate-pulse mx-auto"
    [style.height]="height"
    [style.width]="height"
  ></div>
}
