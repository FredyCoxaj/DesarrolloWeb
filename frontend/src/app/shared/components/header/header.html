<header class="bg-primary text-white shadow-md">
  <div class="max-w-lg mx-auto px-4 py-3 flex items-center justify-between">

    <div class="flex items-center gap-2.5">
      <img src="/icons/logo-a.svg" alt="RutaBus GT" class="w-10 h-10" />
      <div>
        <h1 class="text-base font-bold leading-tight">RutaBus GT</h1>
        <p class="text-xs text-blue-100">Amatitlán & Sur</p>
      </div>
    </div>

    @if (user()) {
      <div class="flex items-center gap-2">
        @if (user()!.dpiVerificado) {
          <span class="bg-green-500 text-white text-xs px-2 py-1 rounded-full">
            DPI ✓
          </span>
        }
        <button class="bg-white/20 text-white text-xs px-3 py-1 rounded-full hover:bg-white/30 transition">
          Cambiar
        </button>
      </div>
    }
  </div>
</header>
