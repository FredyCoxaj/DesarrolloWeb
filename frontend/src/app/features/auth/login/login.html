<h2 class="text-2xl font-bold text-gray-800 mb-1">Iniciar sesión</h2>
<p class="text-sm text-gray-500 mb-5">Ingresa con tu DPI o correo</p>

<form (ngSubmit)="onSubmit()" class="space-y-3">
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">
      DPI o correo
    </label>
    <input
      type="text"
      [value]="identifier"
      (input)="onIdentifierInput($event)"
      name="identifier"
      placeholder="1234567890101"
      autocomplete="username"
      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
    />
  </div>

  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">
      Contraseña
    </label>
    <input
      type="password"
      [(ngModel)]="password"
      name="password"
      placeholder="••••••••"
      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
    />
  </div>

  @if (error()) {
    <div class="bg-red-50 text-red-600 text-sm px-4 py-2 rounded-lg">
      {{ error() }}
    </div>
  }

  <button
  type="submit"
  [disabled]="loading()"
  class="w-full bg-primary text-white font-semibold py-3 rounded-lg hover:bg-blue-800 transition disabled:opacity-50 flex items-center justify-center gap-2"
>
  @if (loading()) {
    Ingresando...
  } @else {
    Iniciar sesión
    <svg lucideArrowRight class="w-[18px] h-[18px]"></svg>
  }
</button>
</form>

<!-- Divisor -->
<div class="flex items-center gap-3 my-5">
  <div class="flex-1 h-px bg-gray-200"></div>
  <span class="text-xs text-gray-400">o continúa con</span>
  <div class="flex-1 h-px bg-gray-200"></div>
</div>

<!-- Social login -->
<div class="grid grid-cols-3 gap-2">
  <button
    type="button"
    (click)="socialLogin('google')"
    class="flex items-center justify-center gap-2 bg-white border border-gray-300 rounded-lg py-2.5 hover:bg-gray-50 transition"
  >
    <svg class="w-5 h-5" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    <span class="text-xs font-medium text-gray-700">Google</span>
  </button>

  <button
    type="button"
    (click)="socialLogin('facebook')"
    class="flex items-center justify-center gap-2 bg-white border border-gray-300 rounded-lg py-2.5 hover:bg-gray-50 transition"
  >
    <svg class="w-5 h-5" fill="#1877F2" viewBox="0 0 24 24">
      <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
    </svg>
    <span class="text-xs font-medium text-gray-700">Facebook</span>
  </button>

  <button
    type="button"
    (click)="socialLogin('apple')"
    class="flex items-center justify-center gap-2 bg-white border border-gray-300 rounded-lg py-2.5 hover:bg-gray-50 transition"
  >
    <svg class="w-5 h-5" fill="#000" viewBox="0 0 24 24">
      <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
    </svg>
    <span class="text-xs font-medium text-gray-700">Apple</span>
  </button>
</div>

<p class="text-center text-sm text-gray-500 mt-5">
  ¿No tienes cuenta?
  <a routerLink="/auth/register" class="text-primary font-semibold hover:underline">
    Regístrate
  </a>
</p>
