<h2 class="text-2xl font-bold text-gray-800 mb-1">Iniciar sesión</h2>
<p class="text-sm text-gray-500 mb-6">Ingresa con tu DPI o correo</p>

<form (ngSubmit)="onSubmit()" class="space-y-4">
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">
      DPI o correo
    </label>
    <input
      type="text"
      [(ngModel)]="identifier"
      name="identifier"
      placeholder="1234567890101"
      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
    />
  </div>

  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">
      Contraseña
    </label>
    <input
      type="password"
      [(ngModel)]="password"
      name="password"
      placeholder="••••••••"
      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
    />
  </div>

  @if (error()) {
    <div class="bg-red-50 text-red-600 text-sm px-4 py-2 rounded-lg">
      {{ error() }}
    </div>
  }

  <button
    type="submit"
    [disabled]="loading()"
    class="w-full bg-primary text-white font-semibold py-3 rounded-lg hover:bg-blue-800 transition disabled:opacity-50"
  >
    @if (loading()) {
      Ingresando...
    } @else {
      Iniciar sesión
    }
  </button>
</form>

<p class="text-center text-sm text-gray-500 mt-6">
  ¿No tienes cuenta?
  <a routerLink="/auth/register" class="text-primary font-semibold hover:underline">
    Regístrate
  </a>
</p>
