<h2 class="text-2xl font-bold text-gray-800 mb-1">Crear cuenta</h2>
<p class="text-sm text-gray-500 mb-6">Regístrate con tu DPI guatemalteco</p>

<form (ngSubmit)="onSubmit()" class="space-y-4">

    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
            DPI <span class="text-red-500">*</span>
        </label>
        <input type="text" [value]="dpi" (input)="onDpiInput($event)" name="dpi" placeholder="1234567890101"
            maxlength="13" inputmode="numeric" autocomplete="off"
            class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
            [class.border-gray-300]="!dpiError && dpiValido" [class.border-red-400]="dpiError"
            [class.border-green-400]="dpiValido" />
        @if (dpiError) {
        <p class="text-xs text-red-500 mt-1">{{ dpiError }}</p>
        }
        @if (dpiValido) {
        <p class="text-xs text-green-600 mt-1">✓ DPI válido</p>
        }
    </div>

    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
            Nombre completo <span class="text-red-500">*</span>
        </label>
        <input type="text" [(ngModel)]="nombre" name="nombre" placeholder="Juan Pérez"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" />
    </div>

    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
            Correo <span class="text-red-500">*</span>
        </label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="juan@correo.com"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" />
    </div>

    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
            Teléfono
        </label>
        <input type="tel" [(ngModel)]="telefono" name="telefono" placeholder="5555-5555"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" />
    </div>

    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
            Fecha de nacimiento <span class="text-red-500">*</span>
        </label>
        <input type="date" [(ngModel)]="fechaNacimiento" name="fechaNacimiento"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" />
    </div>

    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
            Contraseña <span class="text-red-500">*</span>
        </label>
        <input type="password" [(ngModel)]="password" name="password" placeholder="Mínimo 6 caracteres"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" />
    </div>

    @if (error()) {
    <div class="bg-red-50 text-red-600 text-sm px-4 py-2 rounded-lg">
        {{ error() }}
    </div>
    }

    <button type="submit" [disabled]="loading()"
        class="w-full bg-primary text-white font-semibold py-3 rounded-lg hover:bg-blue-800 transition disabled:opacity-50">
        @if (loading()) {
        Registrando...
        } @else {
        Crear cuenta
        }
    </button>
</form>

<p class="text-center text-sm text-gray-500 mt-6">
    ¿Ya tienes cuenta?
    <a routerLink="/auth/login" class="text-primary font-semibold hover:underline">
        Inicia sesión
    </a>
</p>
