<div class="relative inline-block text-left">
  <button
    type="button"
    (click)="toggleDropdown()"
    class="inline-flex items-center gap-1.5 px-3 py-1 text-xs font-semibold rounded-full bg-white/20 hover:bg-white/30 text-white border border-white/25 shadow-xs backdrop-blur transition-all cursor-pointer"
    id="role-switch-button"
  >
    @switch (currentRole()) {
      @case ('ADMIN') {
        <span>🛡️ Admin</span>
      }
      @case ('CHOFER') {
        <span>🚌 Chofer</span>
      }
      @default {
        <span>👤 Pasajero</span>
      }
    }
    <svg class="w-3.5 h-3.5 transition-transform" [class.rotate-180]="isOpen" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  @if (isOpen) {
    <!-- Backdrop to close dropdown -->
    <div class="fixed inset-0 z-40" (click)="isOpen = false"></div>

    <div
      class="absolute right-0 mt-2 w-52 rounded-2xl shadow-2xl bg-white border border-gray-200 py-1.5 z-50 animate-in fade-in zoom-in-95 duration-100 text-gray-800"
    >
      <div class="px-3.5 py-2 border-b border-gray-100 text-[11px] font-bold text-gray-400 uppercase tracking-wider">
        Cambiar Rol de Usuario
      </div>

      <button
        type="button"
        (click)="selectRole('PASAJERO')"
        class="w-full text-left px-3.5 py-2.5 text-xs flex items-center justify-between hover:bg-blue-50/80 transition-colors cursor-pointer"
        [class.font-bold]="currentRole() === 'PASAJERO'"
        [class.text-primary]="currentRole() === 'PASAJERO'"
        [class.bg-blue-50/50]="currentRole() === 'PASAJERO'"
        [class.text-gray-700]="currentRole() !== 'PASAJERO'"
      >
        <span class="flex items-center gap-2.5">
          <span class="text-base">👤</span>
          <span>Pasajero</span>
        </span>
        @if (currentRole() === 'PASAJERO') {
          <span class="text-primary font-bold">✓</span>
        }
      </button>

      <button
        type="button"
        (click)="selectRole('CHOFER')"
        class="w-full text-left px-3.5 py-2.5 text-xs flex items-center justify-between hover:bg-blue-50/80 transition-colors cursor-pointer"
        [class.font-bold]="currentRole() === 'CHOFER'"
        [class.text-primary]="currentRole() === 'CHOFER'"
        [class.bg-blue-50/50]="currentRole() === 'CHOFER'"
        [class.text-gray-700]="currentRole() !== 'CHOFER'"
      >
        <span class="flex items-center gap-2.5">
          <span class="text-base">🚌</span>
          <span>Chofer</span>
        </span>
        @if (currentRole() === 'CHOFER') {
          <span class="text-primary font-bold">✓</span>
        }
      </button>

      <button
        type="button"
        (click)="selectRole('ADMIN')"
        class="w-full text-left px-3.5 py-2.5 text-xs flex items-center justify-between hover:bg-blue-50/80 transition-colors cursor-pointer"
        [class.font-bold]="currentRole() === 'ADMIN'"
        [class.text-primary]="currentRole() === 'ADMIN'"
        [class.bg-blue-50/50]="currentRole() === 'ADMIN'"
        [class.text-gray-700]="currentRole() !== 'ADMIN'"
      >
        <span class="flex items-center gap-2.5">
          <span class="text-base">🛡️</span>
          <span>Administrador</span>
        </span>
        @if (currentRole() === 'ADMIN') {
          <span class="text-primary font-bold">✓</span>
        }
      </button>
    </div>
  }
</div>
