<div class="bg-white rounded-xl p-4 shadow-sm mb-3">
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-lg font-bold text-primary">Monitoreo Satelital de Buses</h2>
      <p class="text-sm text-gray-500 mt-1">
        {{ buses().length }} buses activos
      </p>
    </div>
    <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
  </div>
</div>

<!-- Mapa -->
<div
  id="map"
  class="w-full rounded-xl overflow-hidden shadow-sm"
  style="height: 500px; z-index: 1;">
</div>

<!-- Bottom sheet del bus seleccionado -->
@if (selectedBus()) {
  <div class="fixed bottom-20 left-4 right-4 bg-white rounded-xl shadow-2xl p-4 z-[1000] border-t-4 border-primary">
    <div class="flex items-start justify-between mb-2">
      <div>
        <h3 class="font-bold text-gray-800">{{ selectedBus()!.placa }}</h3>
        <p class="text-sm text-gray-500">{{ selectedBus()!.ruta }}</p>
      </div>
      <button
        (click)="cerrarDetalle()"
        class="text-gray-400 hover:text-gray-600 text-2xl leading-none"
      >
        ×
      </button>
    </div>

    <div class="grid grid-cols-3 gap-2 mt-3">
      <div class="text-center bg-gray-50 rounded-lg py-2">
        <p class="text-xs text-gray-500">ETA</p>
        <p class="font-bold text-primary">{{ selectedBus()!.eta }} min</p>
      </div>
      <div class="text-center bg-gray-50 rounded-lg py-2">
        <p class="text-xs text-gray-500">Ocupación</p>
        <p class="font-bold text-primary">{{ selectedBus()!.ocupacion }}/40</p>
      </div>
      <div class="text-center bg-gray-50 rounded-lg py-2">
        <p class="text-xs text-gray-500">Estado</p>
        <p class="font-bold text-green-600">Activo</p>
      </div>
    </div>

    <button class="w-full bg-primary text-white font-semibold py-2 rounded-lg mt-3 hover:bg-blue-800 transition">
      Reservar asiento
    </button>
  </div>
}
